services:
  wordpress:
    image: wordpress:latest
    container_name: wordpress
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - wordpress_data:/var/www/html
    networks:
      - wordpress_network

  db:
    image: mysql:5.7
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf
      - ./nginx/cloudflare-allow.conf:/etc/nginx/cloudflare-allow.conf
      - ./nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf
      - ./nginx/cloudflare-source-ip.conf:/etc/nginx/cloudflare-source-ip.conf
      - ./nginx/logs:/var/log/nginx
      - static_volume:/app/staticfiles
    ports:
      - "80:80"
    networks:
      - wordpress_network
      - shared_proxy

volumes:
  wordpress_data:
  db_data:
  static_volume:

networks:
  wordpress_network:
  shared_proxy:
    external: true
