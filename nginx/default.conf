worker_processes auto;
events {
    worker_connections 1024;
}

http {
    map $http_origin $cors_origin {
        default 0;
        "~https://www.albaniaconnect.com" $http_origin;
        "~https://albaniaconnect.com" $http_origin;
    }


    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Your server block goes here
    server {
        listen 80;
        server_name actappon.com;

        include /etc/nginx/cloudflare-allow.conf;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
   
    server {
        listen 443 ssl;
        server_name actappon.com;

        include /etc/nginx/cloudflare-allow.conf;

	ssl_certificate /etc/letsencrypt/live/actappon.com/fullchain.pem;
    	ssl_certificate_key /etc/letsencrypt/live/actappon.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        location / {
	        proxy_pass http://wordpress:80;
        	proxy_set_header Host $host;
	        proxy_set_header X-Real-IP $remote_addr;
        	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	        proxy_set_header X-Forwarded-Proto $scheme;
	
	        # Timeout settings
	        proxy_connect_timeout 60s;
        	proxy_send_timeout 60s;
	        proxy_read_timeout 120s;
	        send_timeout 120s;
        }
	
	location = /xmlrpc.php {
        	 deny all;
	         access_log off;
        	 log_not_found off;
     	}

    }

    # Configuration for filebrowser.actappon.com
    server {
        listen 80;
        server_name filebrowser.actappon.com;
	
	client_max_body_size 100M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name filebrowser.actappon.com;

	client_max_body_size 100M;

	ssl_certificate /etc/letsencrypt/live/actappon.com/fullchain.pem;
    	ssl_certificate_key /etc/letsencrypt/live/actappon.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        location / {
                proxy_pass http://filebrowser:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

	
	        # Timeout settings
	        proxy_connect_timeout 60s;
        	proxy_send_timeout 60s;
	        proxy_read_timeout 120s;
	        send_timeout 120s;
        }
    }

    # Configuration for monitor.actappon.com
    server {
        listen 80;
        server_name monitor.actappon.com;
	
	client_max_body_size 100M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name monitor.actappon.com;

	client_max_body_size 100M;

	ssl_certificate /etc/letsencrypt/live/actappon.com/fullchain.pem;
    	ssl_certificate_key /etc/letsencrypt/live/actappon.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        location / {
                proxy_pass http://monitor:3001;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

	
	        # Timeout settings
	        proxy_connect_timeout 60s;
        	proxy_send_timeout 60s;
	        proxy_read_timeout 120s;
	        send_timeout 120s;
        }
    }

}
